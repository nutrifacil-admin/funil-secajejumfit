<body class="tema-escuro">
  <main class="entrada">
    <h1>Acesso à área de membros</h1>

    <div class="entrada-card">
      <img class="entrada-banner" src="assets/front/banner.jpg" width="1920" height="1080" alt="Seca Jejum Turbo">

      <form id="form-entrada" class="entrada-form" novalidate>
        <label for="email">Coloque seu e-mail de compra</label>
        <p class="dica">Use o mesmo e-mail que você informou no pagamento.</p>
        <input id="email" class="campo-email" type="email" name="email"
               placeholder="seuemail@exemplo.com" autocomplete="email" inputmode="email"
               autocapitalize="off" spellcheck="false" required>

        <div id="mensagem" class="mensagem" role="status" aria-live="polite" hidden></div>

        <button id="botao" class="btn" type="submit">Entrar</button>
      </form>
    </div>

    <p class="entrada-rodape">Não precisa de senha. Basta o e-mail usado na compra.</p>
    <div id="suporte"></div>
  </main>
